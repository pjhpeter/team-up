# 本文件由 ~/.hwf/roles.yaml 自动生成，请勿直接手工修改。
# 调整任何角色的工具、模型或思考强度，请编辑 ~/.hwf/roles.yaml 后运行：
#   python3 ~/.hwf/scripts/role_config.py sync
profiles:
  scheduler:
    kind: agy
    args: ["--model", "gemini-4-neon-medium", "--effort", "medium", "--dangerously-skip-permissions"]
  arch:
    kind: agy
    args: ["--model", "gemini-4-neon-xhigh", "--effort", "xhigh", "--dangerously-skip-permissions"]
  arch-lite:
    kind: agy
    args: ["--model", "claude-opus-5-5-medium", "--effort", "medium", "--dangerously-skip-permissions"]
  dev:
    kind: codex
    args: ["-m", "gpt-6.2-sol", "-c", "model_reasoning_effort=medium", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  dev-fe:
    kind: codex
    args: ["-m", "gpt-6.2-sol", "-c", "model_reasoning_effort=medium", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  dev-be:
    kind: codex
    args: ["-m", "gpt-6.2-sol", "-c", "model_reasoning_effort=medium", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  test-writer:
    kind: codex
    args: ["-m", "gpt-6.2-sol", "-c", "model_reasoning_effort=high", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  test:
    kind: codex
    args: ["-m", "gpt-6.2-sol", "-c", "model_reasoning_effort=medium", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  test-herdr:
    kind: codex
    args: ["-m", "gpt-6.2-sol", "-c", "model_reasoning_effort=low", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  precheck:
    kind: codex
    args: ["-m", "gpt-6.2-astra", "-c", "model_reasoning_effort=low", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  code-review:
    kind: codex
    args: ["-m", "gpt-6.2-astra", "-c", "model_reasoning_effort=medium", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
default_profile: scheduler
