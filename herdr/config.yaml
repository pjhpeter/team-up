# 机器级角色定义（hwf 全局插件配置层，最低优先级）。
# 2026-11-11 用户指示：arch 默认恢复 Opus 5.5，用户明确指定时才用其他模型；仍承担方案评审。
# arch 与 arch-lite 的 thinking 均为 medium；三个开发角色 thinking 为 medium，模型保持 gpt-6.1-sol。
# 2026-11-11 用户指示：固定使用 GPT 的成员统一用 codex；模型与思考强度不变。
# 模型不可用时先报告；每次临时替换须用户确认，替换与恢复都记入 STATE。
# 2026-10-20 用户指示：scheduler 不固定模型与思考档，按用户发起工作流时的当前会话
# 模型运行；因此 scheduler 的 args 只保留权限参数，不写 --model / --thinking。
# 合并顺序：本文件 → 仓库 .hwf/config.yaml → 仓库 .hwf/config.local.yaml；
# 后者按“整条命名 entry”覆盖前者，所以仓库里定义同名 profile 会压过这里。
# 目的：Herdr Issue 交付流程的角色（用什么 harness、什么模型、什么思考档）只跟机器走，不跟仓库走。
#
# 用户 2026-10-17 指示：所有成员一律 YOLO 权限，不再逐次审批。
# omp 用 --approval-mode yolo；codex 用 --dangerously-bypass-approvals-and-sandbox；
# pi 无审批门禁。审批授权不改变「禁止在远程服务器执行命令」等全局约束，后者仍由
# PROTOCOL.md 与全局规则执行。
profiles:
  # 入口 `prefix+k` / `hwf run team-up` 新建调度者时用这个 profile。
  # 需要无人值守执行 glab、herdr、git 并写任务记录，因此用 yolo。
  # kind 选 omp：与本机实际运行的调度者一致，且 2026-10-17 实测 herdr 能把 omp 审批界面
  # 判为 blocked（S11）。pi 可选：S9 只证明其 working 可识别；pi 的审批界面识别未实测，
  # 启用 pi 作为调度者前必须补做 S11 同款探针。
  # 2026-10-20 用户指示：不指定模型/思考档，按用户发起工作流时的当前会话模型运行。
  # 身份只看登记名，与 kind 无关。
  # 2026-10-28 用户同意：调度者加载 ~/.hwf/scheduler-omp.yml，约 20 万词元就压缩上下文
  # （默认约 85 万才压缩），降低 8～9 小时长会话的词元消耗；不改模型/思考档。
  scheduler:
    kind: omp
    args: ["--config", "/Users/pengjiahui/.hwf/scheduler-omp.yml", "--approval-mode", "yolo"]
  # 架构师：默认 omp + devin/claude-opus-5-5 + thinking medium；用户指定其他模型时按授权覆盖。
  # 承担复杂度判定、独立方案评审、关键取舍、风险终审与最终验收；不编写技术方案。
  # 常规代码评审和回改由 code-review 承担。
  arch:
    kind: omp
    args: ["--config", "/Users/pengjiahui/.hwf/member-omp.yml", "--model", "devin/claude-opus-5-5", "--thinking", "medium", "--approval-mode", "yolo"]
  # 技术方案编写（arch-lite）：所有技术方案的初稿、逐文件改动、回滚与验证表、评审回改。
  # 方案作者使用 codex + gpt-6-astra，思考强度 medium。
  # 不签发、不拍板、不评审自己的方案；编写会话不得兼任同一交付物的 precheck/arch/dev。
  arch-lite:
    kind: codex
    args: ["-m", "gpt-6-astra", "-c", "model_reasoning_effort=medium", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  # 开发者：按 spec 与已评审用例实现、修复验证失败。
  # 三个开发角色均使用 codex + gpt-6.1-sol，思考强度 medium。
  # 按用户 2026-10-17 指示使用 YOLO（跳过审批与沙箱）。
  # worktree cwd 由调度者通过 `pane split --cwd` 提供。
  dev:
    kind: codex
    args: ["-m", "gpt-6.1-sol", "-c", "model_reasoning_effort=medium", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  # 2026-11-02 用户指示：开发者分前后端，需求前后端都改时两人并行（见 PROTOCOL「前后端并行开发」）。
  # dev-fe 只写前端仓库、dev-be 只写后端仓库；模型暂与 dev 相同，需要时各自改。
  # dev 保留给不分前后端的仓库。
  dev-fe:
    kind: codex
    args: ["-m", "gpt-6.1-sol", "-c", "model_reasoning_effort=medium", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  dev-be:
    kind: codex
    args: ["-m", "gpt-6.1-sol", "-c", "model_reasoning_effort=medium", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  # 测试使用 gpt-6.1-sol：写用例思考强度 high，执行测试 medium。
  # 写用例。审批与 cwd 同 dev（YOLO）。
  test-writer:
    kind: codex
    args: ["-m", "gpt-6.1-sol", "-c", "model_reasoning_effort=high", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  # 2026-11-11 用户指示：浏览器与 Electron 测试统一由 test 执行，按需求选择启动方式。
  test:
    kind: codex
    args: ["-m", "gpt-6.1-sol", "-c", "model_reasoning_effort=medium", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  # 需要访问 herdr socket 的验证角色；沿用 YOLO 权限，避免 workspace-write 沙箱拒绝 socket。
  # 显式固定模型，思考强度保留 low。
  test-herdr:
    kind: codex
    args: ["-m", "gpt-6.1-sol", "-c", "model_reasoning_effort=low", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  # 双层评审的辅审（precheck）：承担机械阅读、取证、候选问题清单，不输出通过结论。
  # 不计入 5/3/6 评审轮次；最终结论由阶段终审人签发（方案 arch、用例 code-review、代码 arch）。
  # 使用 codex + gpt-6-astra，思考强度 low。
  # 不输出通过结论。
  precheck:
    kind: codex
    args: ["-m", "gpt-6-astra", "-c", "model_reasoning_effort=low", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
  # 代码评审使用 codex + gpt-6-astra，思考强度 medium。
  # 承担完整代码评审、增量闭环与测试用例终审；最终风险签发仍归 arch。
  code-review:
    kind: codex
    args: ["-m", "gpt-6-astra", "-c", "model_reasoning_effort=medium", "-c", "model_auto_compact_token_limit=200000", "--dangerously-bypass-approvals-and-sandbox"]
default_profile: scheduler
