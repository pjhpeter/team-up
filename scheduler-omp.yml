# 调度者专用 omp 配置叠加（2026-10-28 用户同意降低调度者词元消耗）。
# 调度者会话常连续跑 8～9 小时，默认要到约 85 万词元才压缩，每次调用都重读整段历史。
# 提前到 20 万压缩；进度靠 .hwf/tmp/<任务>/STATE.md 恢复，不靠聊天历史。
compaction:
  thresholdTokens: 200000
  keepRecentTokens: 30000

# 2026-11-03 用户指示：调度者不在终端弹提问框（ask 工具）。弹框会让调度者停在 blocked，用户不在电脑旁时
# 在飞书/GitLab 里答不了；需要用户拍板时按 PROTOCOL「需要用户确认」发评论列编号选项，结束回合等答复。
ask:
  enabled: false
