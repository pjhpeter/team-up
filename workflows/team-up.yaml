version: v1alpha1
title: Herdr Issue 交付流程
description: 复用空闲调度者或通过 start-scheduler.py 新建调度者（默认 agy + gemini-4-neon-medium），按 ~/.hwf/PROTOCOL.md 自主编排交付。
inputs:
  task:
    type: text
    description: 需求、已有 GitLab issue 链接或需求文档路径
    min_length: 1
  model:
    type: text
    description: 调度者模型覆盖，如 gemini-4-neon-high；留空用 roles.yaml 默认配置
    default: ""
  thinking:
    type: text
    description: 调度者思考强度覆盖，如 low/medium/high；留空用 roles.yaml 默认配置
    default: ""
steps:
  # 指定了 model 或 thinking 时不复用旧会话（直接输出空，走下一步新开调度者）；
  # 都留空时查找空闲调度者并经 reset-session.py 清空上下文（agy 走 /clear，omp 走 /new），确认成功才复用。
  - id: scheduler
    run:
      - sh
      - -c
      - |
        [ -n "$2$3" ] && exit 0
        pane=$(python3 "$HOME/.hwf/scripts/find-scheduler.py" "$1") || exit 1
        if [ -n "$pane" ] && python3 "$HOME/.hwf/scripts/reset-session.py" "$pane" >/dev/null; then
          printf %s "$pane"
        fi
      - find-scheduler
      - "{{context.cwd}}"
      - "{{inputs.model}}"
      - "{{inputs.thinking}}"
    timeout: 40s
  # 复用空闲调度者：单次 prompt 投递，后台推进。
  - herdr: agent.prompt
    params:
      target: "{{steps.scheduler.stdout}}"
      text: &scheduler_prompt |
        你是这项需求的 Herdr 调度者（技术负责人）。
        需求：{{inputs.task}}
        仓库：{{context.cwd}}

        先读 ~/.hwf/PROTOCOL.md（这是唯一核心交付协议：红线、四道交卷硬门槛、角色资源菜单与运行底座脚本）。
        1. 身份与环境：确认自己已登记为 delivery-scheduler-*（用 herdr agent get 回读核对，不重复改名），明确 issue 编号后运行 `python3 ~/.hwf/scripts/name-tab.py <编号|-> <短标题>`，用 `task-record.py index-add / state-set` 维护 `.hwf/tmp/INDEX.md` 与 `STATE.md`（若仍有未收尾在途交付，先 `--queued` 登记不打断现有任务）。
        2. 入口模式：需求以「【对话模式】」开头或未获开工指令时严格只读，派点名角色（默认 arch）分析并原样转达；收到 `/go`（含 `/go debug`）或明确开工指令后进入交付模式。
        3. 自由编排 + 硬门槛：除显式 debug 外，开工前必须由用户本人确认极简人话验收卡（常规/复杂由 arch 查代码起草，原话已写全验收的极小单由你直接整理）；中间拆解与角色选用自主决定；交卷必须过四道硬门槛（独立性「作者 ≠ 审者 ≠ 真机验者」、semantic-lint、develop 真机录屏逐条对账表、release-check 同源校验），交付由用户本人验收与决定合 main / 关单。
        4. 运行纪律：所有评论走 `task-record.py note`（默认免打扰，需要查通知/收件箱细则再看 `~/.hwf/protocol/communication.md`）；禁止弹终端提问框或用内置子代理代干活；派活经 `member-start.py`，同轮用 `run_command`（`WaitMsBeforeAsync: 500, IsDaemon: false`；omp 用 `bash async: true`）后台挂 `member-wait.py`，收取走 `member-settle.py`，收尾走 `wrapup.py`。
    when: "{{steps.scheduler.stdout}}"
  # 新建调度者（含默认配置与自定义 model/thinking）：统一经 start-scheduler.py 启动，
  # 读取 roles.yaml + roles.local.yaml，自动为 agy 注入 --settings trustedWorkspaces 并以登记名启动。
  - run:
      - sh
      - -c
      - 'exec python3 "$HOME/.hwf/scripts/start-scheduler.py" "$1" "$2" "$3"'
      - start-scheduler
      - "{{context.cwd}}"
      - "{{inputs.model}}"
      - "{{inputs.thinking}}"
    env:
      PROMPT: *scheduler_prompt
    timeout: 150s
    when: '{{steps.scheduler.stdout}} == ""'
on_failure:
  herdr: notification.show
  params:
    title: Issue 交付流程需要处理
    body: "第 {{context.error.step_number}} 步（{{context.error.action}}）失败：{{context.error.message}}"
    sound: request
