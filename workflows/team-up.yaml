version: v1alpha1
title: Herdr Issue 交付流程
description: 复用空闲调度者或创建调度者，按 ~/.hwf/PROTOCOL.md 与当前阶段主题推进 Herdr Issue 交付；阶段、确认点与角色权限以协议为准。
inputs:
  task:
    type: text
    description: 需求、已有 GitLab issue 链接或需求文档路径
    min_length: 1
  model:
    type: text
    description: 调度者模型，如 jc-gpt/gpt-6.1-sol；留空用 omp 默认模型
    default: ""
  thinking:
    type: text
    description: 调度者思考强度，如 low/medium/high；留空用模型默认
    default: ""
steps:
  # 发起 issue 时可指定调度者模型与思考强度。指定任一项就用 start-scheduler.py
  # 直接以这些参数新开调度者（已有调度者的模型在会话里换不了，所以不复用）；都留空走原来的复用/新建。
  - id: custom
    run: [sh, -c, 'printf %s "$1$2"', custom, "{{inputs.model}}", "{{inputs.thinking}}"]
  # 发现契约见 find-scheduler.py 文件头：
  #   exit 0 + stdout=pane id → 复用空闲调度者；exit 0 + stdout 空 → 新建（允许多个调度者并行）；
  #   其他退出码 → 入口失败（fail closed）。
  # 空闲 = herdr idle/done，且名下没有未收尾任务、也没有用户未关闭的发起 issue。
  # 复用前先用 reset-session.py 开新会话，不带入之前的对话；
  # 清空未确认时输出空，改为新建调度者，不把需求发给旧会话。
  # list argv 不经 shell：显式 sh -c 展开 $HOME；$0 占位为 find-scheduler，"$1" 接 cwd。
  - id: scheduler
    run:
      - sh
      - -c
      - |
        pane=$(python3 "$HOME/.hwf/scripts/find-scheduler.py" "$1") || exit 1
        if [ -n "$pane" ] && python3 "$HOME/.hwf/scripts/reset-session.py" "$pane" >/dev/null; then
          printf %s "$pane"
        fi
      - find-scheduler
      - "{{context.cwd}}"
    timeout: 40s
    when: '{{steps.custom.stdout}} == ""'
  # 复用单次调用 API，不进入引擎的接收确认循环；工具调用期间消息会排队。
  # 新建分支仍用 background，确认接收后结束；后续交付由调度者按协议推进。
  - herdr: agent.prompt
    params:
      target: "{{steps.scheduler.stdout}}"
      text: |
        你是这项需求的 Herdr 调度者。需求：{{inputs.task}}
        仓库：{{context.cwd}}
        入口已为你开了新会话，之前的对话不在上下文里。先读 ~/.hwf/PROTOCOL.md，再读 ~/.hwf/protocol/scheduling.md「初始化」；你已登记为调度者，先用 herdr agent get 回读核对登记身份，不要重复改名。确定 issue 编号后，用 python3 ~/.hwf/scripts/name-tab.py <编号|-> <短标题> 重命名 tab（未改名时领取不了成员）。
        入口已后台提交本条需求、不等待你的回复；进度写入任务记录与 STATE.md。hwf run id 用 hwf runs list --json --checkout-root {{context.cwd}} 取 workflow 为 team-up 的最新一条，查不到写 n/a。
        按 ~/.hwf/protocol/scheduling.md「任务标识与索引」核对 INDEX 与 STATE；若仍有在途交付，用 task-record.py index-add --queued 记录本需求，不打断现有任务。任务记录、成员复用、派活与等待均执行该主题；你只做调度，不代做成员工作。
        发通知、拆独立 issue 或收到跨 issue 回复前，读 ~/.hwf/protocol/communication.md「通知模式」「独立需求与飞书话题」「GitLab 收件箱」。需求以「【对话模式】」开头时，只派用户点名角色只读分析（未点名派 arch），原样转贴成员结论；你不分析、不读代码、不判复杂度，直到用户 /go 或明确开工才走交付步骤。
        debug 仅由用户明确要求触发（debug 模式、改bug、/go debug、/go 改bug，兼容极简模式、/go 极简）；按 ~/.hwf/protocol/implementation.md「debug 模式」执行，角色与模型取 ~/.hwf/herdr/config.yaml，不能自行选择 debug。
        非 debug 先派 arch 按 ~/.hwf/protocol/planning.md §0 判定，§0.1 用户确认后才走对应路径；方案确认、spec、拆分和 issue 标签均按该主题相应章节执行。
        派测试准备或开发前读 ~/.hwf/protocol/implementation.md §4–6；所有开发含 debug 先过 §6「实现前检查点」，独立 code-review 核准后才派生产代码修改。进入代码评审或自动化验收前读 ~/.hwf/protocol/review-testing.md §7–8；创建或清理工作树前读 ~/.hwf/protocol/worktrees.md。
        发布阶段结果、遇到 MR 冲突、准备结束回合、收到关闭请求或关闭通知时，读 ~/.hwf/protocol/delivery.md §9「完成评论与关闭前核对」「发起 issue 的关闭授权」；按 §9.1 完成 arch 最终验收并核验剩余工作，再决定继续、澄清或收尾，不把阶段通过当作交付完成。
    when:
      - '{{steps.custom.stdout}} == ""'
      - "{{steps.scheduler.stdout}}"
  # 新建调度者的需求文本；指定模型分支经 env 复用同一段（YAML 锚点），不维护两份。
  - agent: &new_scheduler_prompt |
      你是这项需求的 Herdr 调度者。需求：{{inputs.task}}
      仓库：{{context.cwd}}
      先读 ~/.hwf/PROTOCOL.md，再按 ~/.hwf/protocol/scheduling.md「初始化」完成第 1、2 步后登记调度者角色；不要把改名作为第一个动作。登记后用 python3 ~/.hwf/scripts/name-tab.py <issue 编号|-> <短标题> 给 tab 起名（未改名时领取不了成员）。
      入口已后台提交本条需求、不等待你的回复；进度写入任务记录与 STATE.md。hwf run id 取本 pane 环境变量 $HWF_RUN_ID。
      按 ~/.hwf/protocol/scheduling.md「任务标识与索引」核对 INDEX 与 STATE；任务记录、成员复用、派活与等待均执行该主题；你只做调度，不代做成员工作。
      发通知、拆独立 issue 或收到跨 issue 回复前，读 ~/.hwf/protocol/communication.md「通知模式」「独立需求与飞书话题」「GitLab 收件箱」。需求以「【对话模式】」开头时，只派用户点名角色只读分析（未点名派 arch），原样转贴成员结论；你不分析、不读代码、不判复杂度，直到用户 /go 或明确开工才走交付步骤。
      debug 仅由用户明确要求触发（debug 模式、改bug、/go debug、/go 改bug，兼容极简模式、/go 极简）；按 ~/.hwf/protocol/implementation.md「debug 模式」执行，角色与模型取 ~/.hwf/herdr/config.yaml，不能自行选择 debug。
      非 debug 先派 arch 按 ~/.hwf/protocol/planning.md §0 判定，§0.1 用户确认后才走对应路径；方案确认、spec、拆分和 issue 标签均按该主题相应章节执行。
      派测试准备或开发前读 ~/.hwf/protocol/implementation.md §4–6；所有开发含 debug 先过 §6「实现前检查点」，独立 code-review 核准后才派生产代码修改。进入代码评审或自动化验收前读 ~/.hwf/protocol/review-testing.md §7–8；创建或清理工作树前读 ~/.hwf/protocol/worktrees.md。
      发布阶段结果、遇到 MR 冲突、准备结束回合、收到关闭请求或关闭通知时，读 ~/.hwf/protocol/delivery.md §9「完成评论与关闭前核对」「发起 issue 的关闭授权」；按 §9.1 完成 arch 最终验收并核验剩余工作，再决定继续、澄清或收尾，不把阶段通过当作交付完成。
    using: scheduler
    # 每个调度者独占新 tab，不在入口或收件箱旁创建成员；
    # 它的成员按协议在这个 tab 里分屏，多个交付互不挤占。
    pane:
      open: tab
      focus: false
    background: true
    when:
      - '{{steps.custom.stdout}} == ""'
      - '{{steps.scheduler.stdout}} == ""'
  # 指定了模型或思考强度：start-scheduler.py 新开 tab，以登记名启动 omp 并发送同一段需求。
  - run:
      - sh
      - -c
      - 'exec python3 "$HOME/.hwf/scripts/start-scheduler.py" "$1" "$2" "$3"'
      - start-scheduler
      - "{{context.cwd}}"
      - "{{inputs.model}}"
      - "{{inputs.thinking}}"
    env:
      PROMPT: *new_scheduler_prompt
    timeout: 150s
    when: "{{steps.custom.stdout}}"
on_failure:
  herdr: notification.show
  params:
    title: Issue 交付流程需要处理
    body: "第 {{context.error.step_number}} 步（{{context.error.action}}）失败：{{context.error.message}}"
    sound: request
